name: Bug report
description: Report incorrect output, a crash, or a build failure.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and the full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU, driver version, `gyro-dx probe` output, and the model file name and revision.
      render: text
    validations:
      required: true
